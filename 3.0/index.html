<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明日のお茶投票</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6b9080;
            --secondary-color: #a4c3b2;
            --accent-color: #f6bd60;
            --bg-color: #f7f1e3;
            --text-color: #5d5d5d;
            --card-bg: #ffffff;
            --border-radius: 24px;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #f7f1e3 0%, #f9ebff 50%, #e3f2fd 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 40px 0;
        }

        .bg-emoji {
            position: fixed;
            bottom: -100px;
            font-size: 3.5rem;
            opacity: 0;
            z-index: -1;
            user-select: none;
            animation: float 12s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        .e1 { left: 2%; animation-duration: 18s; animation-delay: 0s; }
        .e2 { left: 10%; animation-duration: 22s; animation-delay: -5s; }
        .e3 { left: 18%; animation-duration: 15s; animation-delay: -2s; }
        .e4 { left: 25%; animation-duration: 25s; animation-delay: -10s; }
        .e5 { left: 32%; animation-duration: 19s; animation-delay: -3s; }
        .e6 { left: 40%; animation-duration: 21s; animation-delay: -7s; }
        .e7 { left: 48%; animation-duration: 17s; animation-delay: -1s; }
        .e8 { left: 55%; animation-duration: 24s; animation-delay: -4s; }
        .e9 { left: 62%; animation-duration: 20s; animation-delay: -8s; }
        .e10 { left: 70%; animation-duration: 16s; animation-delay: -12s; }
        .e11 { left: 78%; animation-duration: 23s; animation-delay: -6s; }
        .e12 { left: 85%; animation-duration: 14s; animation-delay: -9s; }
        .e13 { left: 92%; animation-duration: 26s; animation-delay: -15s; }
        .e14 { left: 5%; animation-duration: 20s; animation-delay: -11s; }
        .e15 { left: 95%; animation-duration: 19s; animation-delay: -2s; }
        .e16 { left: 50%; animation-duration: 22s; animation-delay: -5s; }

        .app-container {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), 0 5px 15px rgba(0, 0, 0, 0.05);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 4px solid #fff;
            position: relative;
            z-index: 1;
            animation: slideDown 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        header h1 {
            margin-bottom: 0.8rem;
            color: var(--primary-color);
            font-size: 2.5rem;
        }

        header p {
            margin-bottom: 2.5rem;
            font-size: 1.2rem;
            color: #888;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem;
            border-radius: 15px;
            border: 2px solid #eee;
            font-family: inherit;
            font-size: 1.1rem;
            outline: none;
            box-sizing: border-box;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .tea-card {
            cursor: pointer;
            position: relative;
        }

        .tea-card input {
            position: absolute;
            opacity: 0;
        }

        .card-content {
            background: #fdfdfd;
            border: 2px solid #f0f0f0;
            padding: 1.5rem 1rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 0 #f0f0f0;
        }

        .card-content .icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }

        .card-content .name {
            font-weight: bold;
            font-size: 1.3rem;
            color: var(--primary-color);
        }

        .tea-card:hover .card-content {
            transform: translateY(-3px);
            box-shadow: 0 7px 0 #f0f0f0;
        }

        .tea-card input:checked + .card-content {
            border-color: var(--secondary-color);
            background-color: #f0f9f4;
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--secondary-color);
        }

        .vote-button, .secondary-button, .login-button {
            width: 100%;
            padding: 1.2rem;
            border: none;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            outline: none;
        }

        .vote-button, .login-button {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 0 #e67e22;
        }

        .vote-button:hover, .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #e67e22;
        }

        .vote-button:active, .login-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #e67e22;
        }

        .secondary-button {
            background-color: #f1f2f6;
            color: #a4b0be;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        #results {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        #results-container {
            text-align: left;
            margin-top: 1rem;
            padding: 0 0.5rem;
        }

        .result-item {
            margin-bottom: 2rem;
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .tea-cup-display {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 15px;
            min-height: 50px;
        }

        .tea-cup {
            font-size: 2rem;
            display: inline-block;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        #logout-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.8rem;
            padding: 5px 10px;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="bg-emoji e1">🍵</div>
    <div class="bg-emoji e2">🍃</div>
    <div class="bg-emoji e3">🌸</div>
    <div class="bg-emoji e4">🍂</div>
    <div class="bg-emoji e5">🪵</div>
    <div class="bg-emoji e6">🍬</div>
    <div class="bg-emoji e7">🍵</div>
    <div class="bg-emoji e8">🍰</div>
    <div class="bg-emoji e9">🌸</div>
    <div class="bg-emoji e10">🍃</div>
    <div class="bg-emoji e11">🍡</div>
    <div class="bg-emoji e12">🍵</div>
    <div class="bg-emoji e13">🧁</div>
    <div class="bg-emoji e14">🌸</div>
    <div class="bg-emoji e15">🍂</div>
    <div class="bg-emoji e16">🍮</div>

    <div class="app-container">
        <button id="logout-button" class="secondary-button hidden">ログアウト</button>
        <header>
            <h1>🍵 明日のお茶投票</h1>
            <p id="app-desc">明日、どのお茶を買うか決めてください！</p>
        </header>

        <main>
            <!-- ログインフォーム -->
            <form id="login-form">
                <div class="input-group">
                    <label for="username">ユーザー名</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="login-button">ログイン</button>
            </form>

            <!-- 投票フォーム -->
            <form id="vote-form" class="hidden">
                <div class="options-grid">
                    <label class="tea-card">
                        <input type="radio" name="tea" value="sencha" required>
                        <div class="card-content">
                            <span class="icon">🍃</span>
                            <span class="name">煎茶</span>
                        </div>
                    </label>
                    <label class="tea-card">
                        <input type="radio" name="tea" value="hojicha">
                        <div class="card-content">
                            <span class="icon">🍂</span>
                            <span class="name">ほうじ茶</span>
                        </div>
                    </label>
                    <label class="tea-card">
                        <input type="radio" name="tea" value="oolong">
                        <div class="card-content">
                            <span class="icon">🪵</span>
                            <span class="name">烏龍茶</span>
                        </div>
                    </label>
                    <label class="tea-card">
                        <input type="radio" name="tea" value="jasmine">
                        <div class="card-content">
                            <span class="icon">🌸</span>
                            <span class="name">ジャスミン茶</span>
                        </div>
                    </label>
                </div>
                <button type="submit" class="vote-button">投票する</button>
            </form>

            <!-- 結果表示エリア -->
            <section id="results" class="hidden">
                <h2>投票結果</h2>
                <div id="results-container"></div>
                <button id="back-button" class="secondary-button">戻る</button>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loginForm = document.getElementById('login-form');
            const voteForm = document.getElementById('vote-form');
            const resultsSection = document.getElementById('results');
            const resultsContainer = document.getElementById('results-container');
            const backButton = document.getElementById('back-button');
            const logoutButton = document.getElementById('logout-button');
            const appDesc = document.getElementById('app-desc');

            const teaNames = { sencha: '煎茶', hojicha: 'ほうじ茶', oolong: '烏龍茶', jasmine: 'ジャスミン茶' };
            const teaIcons = { sencha: '🍃', hojicha: '🍂', oolong: '🪵', jasmine: '🌸' };

            const checkAuth = async () => {
                try {
                    const res = await fetch('/me');
                    if (res.ok) {
                        showVoteView();
                    } else {
                        showLoginView();
                    }
                } catch (e) { showLoginView(); }
            };

            const showLoginView = () => {
                loginForm.classList.remove('hidden');
                voteForm.classList.add('hidden');
                resultsSection.classList.add('hidden');
                logoutButton.classList.add('hidden');
                appDesc.textContent = 'ログインして投票に参加しよう！';
            };

            const showVoteView = () => {
                loginForm.classList.add('hidden');
                voteForm.classList.remove('hidden');
                resultsSection.classList.add('hidden');
                logoutButton.classList.remove('hidden');
                appDesc.textContent = '明日、どのお茶を買うか決めてください！';
            };

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) { showVoteView(); } else { alert('ログインに失敗しました'); }
            });

            logoutButton.addEventListener('click', async () => {
                await fetch('/logout', { method: 'POST' });
                showLoginView();
            });

            const fetchAndRenderResults = async () => {
                try {
                    const response = await fetch('/votes');
                    if (!response.ok) return;
                    const serverVotes = await response.json();
                    const votes = { sencha: 0, hojicha: 0, oolong: 0, jasmine: 0 };
                    serverVotes.forEach(v => { if (votes.hasOwnProperty(v.option)) votes[v.option] = v.count; });
                    resultsContainer.innerHTML = '';
                    Object.keys(votes).forEach(key => {
                        const count = votes[key];
                        const resultItem = document.createElement('div');
                        resultItem.className = 'result-item';
                        resultItem.innerHTML = `<div class="result-label"><span>${teaIcons[key]} ${teaNames[key]}</span><span>${count}票</span></div>`;
                        const cupDisplay = document.createElement('div');
                        cupDisplay.className = 'tea-cup-display';
                        for (let i = 0; i < count; i++) {
                            const cup = document.createElement('span');
                            cup.className = 'tea-cup';
                            cup.textContent = '🍵';
                            cup.style.animationDelay = `${i * 0.1}s`;
                            cupDisplay.appendChild(cup);
                        }
                        if (count === 0) cupDisplay.innerHTML = '<span style="font-size: 0.9rem; opacity: 0.5; padding: 10px;">まだ票がありません</span>';
                        resultItem.appendChild(cupDisplay);
                        resultsContainer.appendChild(resultItem);
                    });
                } catch (err) { console.error(err); }
            };

            voteForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const selectedTea = voteForm.tea.value;
                if (selectedTea) {
                    const submitButton = voteForm.querySelector('.vote-button');
                    submitButton.disabled = true;
                    submitButton.textContent = '送信中...';
                    try {
                        const response = await fetch('/vote', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ option: selectedTea })
                        });
                        if (response.ok) {
                            await fetchAndRenderResults();
                            voteForm.classList.add('hidden');
                            resultsSection.classList.remove('hidden');
                        } else { alert('投票に失敗しました。'); }
                    } catch (err) { alert('通信に失敗しました。'); }
                    finally { submitButton.disabled = false; submitButton.textContent = '投票する'; }
                }
            });

            backButton.addEventListener('click', () => {
                resultsSection.classList.add('hidden');
                voteForm.classList.remove('hidden');
                voteForm.reset();
            });

            checkAuth();
        });
    </script>
</body>
</html>
